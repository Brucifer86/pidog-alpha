[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pidog-alpha"
version = "0.1.0"
description = "Remote-control web service for a SunFounder PiDog running on Raspberry Pi."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
pidog-web = "main:main"

[tool.setuptools]
packages = ["pidog_alpha"]
py-modules = ["main"]
