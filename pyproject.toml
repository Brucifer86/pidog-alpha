[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pidog-alpha"
version = "0.1.0"
description = "Remote-control web service for a SunFounder PiDog running on Raspberry Pi."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
mcp = [
    "fastmcp>=2.0,<3.0",
    "httpx>=0.27,<1.0",
]

[project.scripts]
pidog-web = "main:main"
pidog-mcp = "pidog_mcp:mcp.run"

[tool.setuptools]
packages = ["pidog_alpha"]
py-modules = ["main"]
